<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Modelo de Black & Litterman</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="static/style.css" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="src/shared/matrix.js"></script>
  <script src="src/servicos/servico-modelo.js"></script>
  <script src="src/servicos/servico-black-litterman.js"></script>
  <script src="src/componentes/componente-homepage.js"></script>
  <script src="src/componentes/componente-editor-ativos.js"></script>
  <script src="src/componentes/componente-editor-correlacao.js"></script>
  <script src="src/componentes/componente-editor-parametros.js"></script>
  <script src="src/componentes/componente-exportacao.js"></script>
  <script src="src/componentes/componente-calculadora.js"></script>
  <script src="src/roteador/roteador.js"></script>
</head>

<body>
  <div class="sidebar">
  </div>

  <div class="content">
    <div id="conteudo">
    </div>
  </div>

  <script>
    $(document).ready(function() {
      roteador.criaNavegador($(".sidebar"), $("#conteudo"), "Modelo de Black & Litterman");
      roteador.selecionaComponente("home")

      const queryString = window.location.search;
      const urlParameters = new URLSearchParams(queryString);
      const data = urlParameters.get('data');

      if (data) {
        try {
          const jsonString = atob(data);
          const dados = JSON.parse(jsonString);
          servicoModelo.salvaDados(dados);
        } catch (e) {
          console.error("Erro ao decodificar os dados da URL:", e);
        }
      }
    });
  </script>
</body>
</html>
